# FT2232H interface preset for 3322 boards.
#
# This is a sibling of ft2232h-ftdi-swd.cfg. The ONLY functional difference is that
# SWDIO_OE below carries NO -data 0x800. Use THIS file for 3322 on a plain
# FT2232H breakout that has no external SWDIO direction buffer.
#
# Why a separate file: with "-data 0x800" (the HH801V100 buffer-board setting, kept
# in ft2232h-ftdi-swd.cfg) the ftdi driver leaves TDI driven during SWD reads and
# fights the target on the SWDIO line; 3322's SW-DP cannot overcome it and OpenOCD
# fails with "cannot read IDR" (3066H tolerates the fight, so the bug looks
# chip-specific). Dropping -data 0x800 makes data_mask==0, so the driver tri-states
# TDI before each SWD read (ftdi.c TDI-direction-switch branch) and 3322 connects.
#
# Pair with the 3322 target cfg:
#   openocd -s scripts -f interface/ft2232h-ftdi-3322.cfg -f target/vendorhm/3322-jlink.cfg
#   openocd -s . -f ft2232h-ftdi-3322.cfg -f 3322-jlink.cfg

# FT2232H USE CHANNEL A - MPSSE.

# USE 3 PINS.
# TMS TDO TDI TCK
# X   I   O   O
# OUTPUT=1,INPUT=0,0x000b=X011
# SWD_EN(FUTURE) GPIOL1,GPIOH3  0x0020 HIGH=5LINE,LOW=2LINE
# SWDIO_OE  TX: GPIOH3=LOW, RX: GPIOH3=HIGHT
# LED            GPIOL2  0x0040
# LED2           GPIOL3  0x0080
# Attention: the type of TDO is INPUT while TDI is OUTPUT.

# Notice:
# You can control the LED2 manually
#   turn on:  ftdi_set_signal LED2 1
#   turn off: ftdi_set_signal LED2 0

# when use ARM target, you must use srst to reset. it's a bug. FIXME in code.
# reset_config srst_only

adapter driver ftdi
#ftdi_device_desc "Dual RS232"
ftdi_vid_pid 0x0403 0x6010
ftdi_channel 0

ftdi_layout_init 0x00c8 0x08eb

ftdi_layout_signal SWD_EN -ndata 0x0820

# Plain FT2232H board (no SWDIO direction buffer): NO -data 0x800. data_mask==0 makes
# the driver tri-state TDI during SWD reads so the target can drive SWDIO.
# (On HH801V100 buffer boards, use ft2232h-ftdi-swd.cfg with "-data 0x800" instead.)
ftdi_layout_signal SWDIO_OE

ftdi_layout_signal LED  -ndata 0x0040
ftdi_layout_signal LED2 -ndata 0x0080

# False signal, ARM target in OpenOCD needs nSRST signal,
# but hardware doesn't need to implement this signal.
ftdi_layout_signal nSRST -oe 0x0100

# Connection speed, not too fast
# adapter speed 500

#  ftdi: if you experience problems at higher adapter clocks, try the command "ftdi_tdo_sample_edge falling"
ftdi_tdo_sample_edge falling
