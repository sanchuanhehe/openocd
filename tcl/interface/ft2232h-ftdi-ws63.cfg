# FT2232H interface preset for WS63/H3863 boards.
#
# Usage:
#   openocd -s scripts -f interface/ft2232h-ftdi-ws63.cfg -f target/vendorhm/WS63-swd.cfg
#   openocd -s . -f ft2232h-ftdi-ws63.cfg -f WS63-swd.cfg

# FT2232H USE CHANNEL A - MPSSE.
#
# USE 3 PINS.
# TMS TDO TDI TCK
# X   I   O   O
# OUTPUT=1,INPUT=0,0x000b=X011
# SWD_EN(FUTURE) GPIOL1,GPIOH3  0x0020 HIGH=5LINE,LOW=2LINE
# SWDIO_OE  TX: GPIOH3=LOW, RX: GPIOH3=HIGHT
# LED            GPIOL2  0x0040
# LED2           GPIOL3  0x0080
# Attention: the type of TDO is INPUT while TDI is OUTPUT.

adapter driver ftdi
#ftdi_device_desc "Dual RS232"
ftdi_vid_pid 0x0403 0x6010
ftdi_channel 0

ftdi_layout_init 0x00c8 0x08eb

ftdi_layout_signal SWD_EN -ndata 0x0820

# WS63 with this FT2232H probe wiring has no external SWDIO direction buffer.
# Leave SWDIO_OE without -data so TDI is tri-stated during SWD reads.
ftdi_layout_signal SWDIO_OE

ftdi_layout_signal LED  -ndata 0x0040
ftdi_layout_signal LED2 -ndata 0x0080

# False signal, ARM target in OpenOCD needs nSRST signal,
# but hardware doesn't need to implement this signal.
ftdi_layout_signal nSRST -oe 0x0100

# WS63 needs connect-under-reset with this FT2232H probe wiring.
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst

#  ftdi: if you experience problems at higher adapter clocks, try the command "ftdi_tdo_sample_edge falling"
ftdi_tdo_sample_edge falling
