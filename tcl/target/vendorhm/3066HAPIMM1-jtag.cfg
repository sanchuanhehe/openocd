transport select jtag

set  _CHIPNAME 3066H
set  _CHIPNAME1 3066H_1
set  _CHIPNAME2 3066H_2
set  _CHIPNAME_MAIN AA_MAIN
set  _CHIPNAME_INFO AA_INFO

set _CPUTAPID 0x5ba00477
set _ENDIAN little

jtag newtap $_CHIPNAME cpu -irlen 4  -expected-id $_CPUTAPID

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME1 $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME1.cpu
set _TARGETNAME2 $_CHIPNAME2.cpu

target create $_TARGETNAME1 mem_ap -dap $_CHIPNAME.dap -ap-num 3  -dbgbase 0x3000000
target create $_TARGETNAME2 mem_ap -dap $_CHIPNAME.dap -ap-num 1  -dbgbase 0x1000000
target create $_TARGETNAME riscvcs -endian $_ENDIAN -apsel 1 -dap $_CHIPNAME.dap -dbgbase 0x80000000

set _MAIN_FLASHNAME $_CHIPNAME_MAIN.flash
set _INFO_FLASHNAME $_CHIPNAME_INFO.flash

flash bank $_MAIN_FLASHNAME hi3066h_main 0x3000000 0x100000 0 0 $_TARGETNAME
flash bank $_INFO_FLASHNAME hi3066h_info 0x3800000 0x8000 0 0 $_TARGETNAME

riscv expose_csrs 932-943,1984-1999,2008
riscv set_prefer_sba off

init
targets $_TARGETNAME1
halt

$_TARGETNAME1 mww 0x10000604 0x1

init
targets $_TARGETNAME2
halt

$_TARGETNAME2 mww 0x40 0x80000001

targets $_TARGETNAME

$_TARGETNAME configure -event gdb-flash-erase-start {
    init
    halt
}

$_TARGETNAME configure -event gdb-flash-write-end {
    init
    targets $_TARGETNAME1
    halt
    $_TARGETNAME1 mww 0x10000604 0x00010000
    $_TARGETNAME1 mww 0x10000604 0x1
    targets $_TARGETNAME2
    halt
    $_TARGETNAME2 mww 0x40 0x80000001
    targets $_TARGETNAME
    halt
}

$_TARGETNAME arp_examine
halt
