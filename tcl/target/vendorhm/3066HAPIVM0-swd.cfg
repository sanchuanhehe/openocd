
# USAGE:
# cmd: bin\openocd.exe  -c "gdb_port 30000" -s scripts -f interface\ft2232h-ftdi-swd.cfg  -f target\HI3066H-swd.cfg
# cmd: bin\openocd.exe  -c "gdb_port 30000" -s scripts -f interface\ft2232h-ftdi-swd.cfg  -f target\HI3066H-swd.cfg  -d3 -l log.txt
# cmd: telnet localhost 4444

# enable coresight-swd mode
# mww 0x40010260 1

# adapter speed 1000

transport select swd

set  _CHIPNAME HI3066H
set  _CHIPNAME_MAIN HI3066H_MAIN
set  _CHIPNAME_INFO HI3066H_INFO

# HI3066H SWD mode  _CPUTAPID 0x5ba02477
set _CPUTAPID 0x5ba02477
set  _ENDIAN little

#SWD mode will not USAGE irlen/-ircapture/-irmask
swd newdap $_CHIPNAME cpu -expected-id $_CPUTAPID

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu

target create $_TARGETNAME riscvcs -endian $_ENDIAN -apsel 0 -dap $_CHIPNAME.dap -dbgbase 0x80000000
# $_TARGETNAME configure -work-area-phys 0x03FC0000 -work-area-size 0x00002000 -work-area-backup 0

set _MAIN_FLASHNAME $_CHIPNAME_MAIN.flash
set _INFO_FLASHNAME $_CHIPNAME_INFO.flash

flash bank $_MAIN_FLASHNAME hi3066h_main 0x3000000 0x100000 0 0 $_TARGETNAME
flash bank $_INFO_FLASHNAME hi3066h_info 0x3800000 0x8000 0 0 $_TARGETNAME



# 0X7c0~0x7cf 2008=7d8
riscv expose_csrs 932-943,1984-1999,2008
riscv set_prefer_sba off

init
halt
# If load_image fails, reduce the FREQUENCY

# adapter speed 1000

#print log
