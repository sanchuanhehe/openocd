transport select swd

set  _CHIPNAME HI3071

set _CPUTAPID 0x0BD11477
set  _ENDIAN little

swd newdap $_CHIPNAME cpu -expected-id $_CPUTAPID

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
set _FLASHNAME $_CHIPNAME.flash
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap -dbgbase 0x80000000
flash bank $_FLASHNAME hi3071 0x00100000 0x80 0 0 $_TARGETNAME
gdb_breakpoint_override hard
$_TARGETNAME configure -event gdb-flash-write-end {
    init
    halt
    $_TARGETNAME mww 0x40000124 0x0
    halt
}

init
halt





