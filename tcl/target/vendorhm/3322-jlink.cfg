# 3322 with SEGGER J-Link configuration (SWD)
#
# Filename must be <CHIP>-swd.cfg / <CHIP>-jtag.cfg / <CHIP>-jlink.cfg. In the flat
# package the cfg sits next to the binary, so invoke it by bare name
# (e.g. -f 3322-jlink.cfg): extract_chip() then derives chip_type="3322" and
# gdb_server forces hardware breakpoints. 3322 code runs in flash, so software
# breakpoints (EBREAK patch) cannot work -- this routing makes GDB `break` use
# hardware triggers (tselect/tdata CSRs) instead.
#
# Usage examples (flat package — cfgs sit next to the binary):
#   openocd -f jlink.cfg -f 3322-jlink.cfg
#   openocd -f jlink.cfg -f 3322-jlink.cfg -d3 -l log.txt
#   telnet localhost 4444
#
# *****************************************************************************

# Use SWD transport
transport select swd

# Chip identification
set _CHIPNAME 3322
set _CPUTAPID 0x20000477
set _ENDIAN little

# Create SWD DAP
swd newdap $_CHIPNAME cpu -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# Target creation - RISC-V CoreSight
# APSEL=1 based on J-Link script (CORESIGHT_IndexAHBAPToUse = 1)
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscvcs -endian $_ENDIAN -apsel 1 -dap $_CHIPNAME.dap -dbgbase 0x80000000

# No flash bank: debug-only. Burn firmware with the dedicated 3322 burning
# tool; GDB `load` into flash addresses is not supported.

# CSR expose for RISC-V debugging
riscv expose_csrs 932-943,1984-1999,2008
riscv set_mem_access sysbus

# Adapter speed - 2000 kHz (2 MHz)
adapter speed 2000

# Initialize and halt
init
halt
