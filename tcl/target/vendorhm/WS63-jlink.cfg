# Legacy entry point, now sharing the corrected WS63 target implementation.
# Keep debug-only behavior unless Flash support is explicitly requested.
if {![info exists WS63_FLASH]} { set WS63_FLASH 0 }
if {![info exists ADAPTER_SPEED]} { set ADAPTER_SPEED 2000 }
adapter speed $ADAPTER_SPEED
if {[catch {find target/ws63.cfg} ws63_config]} {
    set ws63_config [find ws63.cfg]
}
source $ws63_config
init
halt
