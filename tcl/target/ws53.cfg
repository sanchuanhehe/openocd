# WS53: AP0 debug enable, AP1 RISC-V DM (not WS63's AP0).
# Debug only: no flash bank. Existing firmware must expose SWD pins.
# Usage: openocd -f interface/jlink.cfg -c "adapter serial 23121310" \
#          -f target/ws53.cfg -c "init; halt"
transport select swd
if {![info exists CHIPNAME]} { set CHIPNAME WS53 }
if {![info exists ADAPTER_SPEED]} { set ADAPTER_SPEED 100 }
adapter speed $ADAPTER_SPEED
swd newdap $CHIPNAME cpu -expected-id 0x5ba02477
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu riscvcs -endian little -dap $CHIPNAME.dap -apsel 1 -dbgbase 0
targets $CHIPNAME.cpu
riscv ws53 on
riscv set_mem_access progbuf
# ROM/XIP cannot be patched with software breakpoints.
gdb_breakpoint_override hard

# Raw MEM-AP views: AP0 is the system bus; AP1/AP2 expose Debug Modules.
# Keep the CPU first so its vendor debug-enable sequence runs before these APs
# are examined. Raw views do not represent additional CPUs or GDB servers.
foreach _ws53_ap {0 1 2} {
    $CHIPNAME.dap apsel $_ws53_ap
    $CHIPNAME.dap apcsw 0x43800000
    target create $CHIPNAME.ap$_ws53_ap mem_ap -endian little \
        -dap $CHIPNAME.dap -ap-num $_ws53_ap -gdb-port disabled
}
unset _ws53_ap
$CHIPNAME.dap apsel 1
targets $CHIPNAME.cpu
