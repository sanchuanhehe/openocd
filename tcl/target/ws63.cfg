# WS63: AP0 is the RISC-V Debug Module; AP1 is the system memory bus.
# FlashBoot must already have enabled SWD on GPIO13/GPIO14.
transport select swd
swd newdap WS63 cpu -expected-id 0x5ba02477
dap create WS63.dap -chain-position WS63.cpu
target create WS63.cpu riscvcs -endian little -dap WS63.dap -apsel 0 -dbgbase 0x80000000
target create WS63.ap1 mem_ap -endian little -dap WS63.dap -ap-num 1 -gdb-port disabled
targets WS63.cpu
riscv ws63 on
riscv expose_csrs 1986-1987
riscv set_mem_access progbuf

proc ws63_ap1_sync_dcache {} {
    if {[WS63.cpu curstate] ne "halted"} { error "halt WS63.cpu first" }
    riscv ws63_sync data
}
proc ws63_sync_code {} {
    ws63_ap1_sync_dcache
    riscv ws63_sync code
}
proc ws63_ap1_dump {filename address size} {
    set previous [target current]
    targets WS63.ap1
    set status [catch {dump_image $filename $address $size} result]
    targets $previous
    return -code $status $result
}

if {![info exists WS63_FLASH_BACKUP_DIR]} { set WS63_FLASH_BACKUP_DIR ws63-flash-backups }
if {![info exists WS63_FLASH] || $WS63_FLASH} {
    flash bank WS63.flash ws63 0x200000 0x400000 0 0 WS63.cpu $WS63_FLASH_BACKUP_DIR
}
if {[info exists WS63_FLASH_SWBP] && $WS63_FLASH_SWBP} {
    riscv ws63_flash_breakpoints on
}

# Load the ELF-derived RTOS configuration after this file (see doc/ws63.md).
